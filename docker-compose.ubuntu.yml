services:
  backend:
    build: ./backend
    container_name: db-hdc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - .:/workspace:ro
      - ${UPLOAD_DATA_DIR:-/opt/db-hdc/uploads}:/uploads
      - ${DASHBOARD_DATA_DIR:-/opt/db-hdc/data}:/onedrive-dashboard:ro
    environment:
      - ENV=production
      - PROJECT_ROOT=/workspace
      - HOST_DASHBOARD_PATH=${DASHBOARD_DATA_DIR:-/opt/db-hdc/data}
      - CONTAINER_DASHBOARD_PATH=/onedrive-dashboard
      - UPLOAD_ROOT=/uploads
      - INBOUND_SOURCE=/onedrive-dashboard/Inbound.xlsx
      - PICK_SOURCE=/onedrive-dashboard/Pick.xlsx
      - PICK_STOCKTAKE_SOURCE=/onedrive-dashboard/DASHBOARD-ST.xlsx
      - OUTBOUND_SOURCE=/onedrive-dashboard/Outbound.xlsx
      - USE_MOCK=false
      - EXCEL_URLS=
    restart: always

  frontend:
    build: ./frontend
    container_name: db-hdc-frontend
    ports:
      - "8080:80"
    restart: always
